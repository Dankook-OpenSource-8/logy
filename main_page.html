<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FreshMate Main</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #24272f;
      background: #f4f6fa;
    }

    main {
      width: min(840px, calc(100% - 32px));
      margin: 48px auto;
      padding: 28px;
      border: 1px solid #d8dde6;
      border-radius: 8px;
      background: #fff;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 34px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    p {
      margin: 0;
      color: #626b78;
      line-height: 1.6;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 20px;
    }

    button,
    a.button {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      border: 0;
      border-radius: 6px;
      padding: 0 16px;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      text-decoration: none;
      color: #fff;
      background: #2f6fed;
    }

    button.ghost,
    a.ghost {
      color: #333842;
      background: #e8ebf0;
    }

    pre {
      overflow: auto;
      margin: 20px 0 0;
      padding: 14px;
      border-radius: 6px;
      color: #f4f7fb;
      background: #20242c;
      line-height: 1.45;
      min-height: 90px;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <main>
    <h1>FreshMate 메인</h1>
    <p>로그인 성공 후 이동하는 임시 메인 페이지입니다.</p>

    <div class="actions">
      <button id="meButton">내 정보 확인</button>
      <button class="ghost" id="logoutButton">로그아웃</button>
      <a class="button ghost" href="/auth/kakao/test">테스트 페이지로 돌아가기</a>
    </div>

    <pre id="output">로그인 정보를 확인하려면 내 정보 확인을 누르세요.</pre>
  </main>

  <script>
    const tokenKey = "freshmate_access_token";
    const output = document.getElementById("output");

    // API 응답 출력 함수
    function show(value) {
      output.textContent = typeof value === "string" ? value : JSON.stringify(value, null, 2);
    }

    // 토큰 없을 경우 로그인 페이지로 이동
    if (!localStorage.getItem(tokenKey)) {
      window.location.href = "/auth/kakao/test";
    }

    // 현재 사용자 정보 조회 함수
    async function loadMe() {
      const response = await fetch("/users/me", {
        headers: {
          Authorization: `Bearer ${localStorage.getItem(tokenKey)}`,
        },
      });
      const body = await response.json();
      if (!response.ok) {
        throw body;
      }
      return body;
    }

    document.getElementById("meButton").addEventListener("click", async () => {
      try {
        show(await loadMe());
      } catch (error) {
        show(error);
      }
    });

    document.getElementById("logoutButton").addEventListener("click", async () => {
      try {
        await fetch("/auth/logout", {
          method: "POST",
          headers: {
            Authorization: `Bearer ${localStorage.getItem(tokenKey)}`,
          },
        });
      } finally {
        localStorage.removeItem(tokenKey);
        window.location.href = "/auth/kakao/test";
      }
    });
  </script>
</body>
</html>
