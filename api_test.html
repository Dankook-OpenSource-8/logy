<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Logy Backend Test</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #24272f;
      background: #f4f6fa;
    }

    main {
      width: min(980px, calc(100% - 32px));
      margin: 36px auto;
    }

    h1 {
      margin: 0 0 18px;
      font-size: 32px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 14px;
    }

    section {
      border: 1px solid #d9dee8;
      border-radius: 8px;
      padding: 18px;
      background: #fff;
    }

    h2 {
      margin: 0 0 14px;
      font-size: 18px;
      letter-spacing: 0;
    }

    label {
      display: grid;
      gap: 6px;
      margin-bottom: 12px;
      color: #535b68;
      font-size: 14px;
      font-weight: 700;
    }

    input {
      width: 100%;
      min-height: 42px;
      border: 1px solid #cbd2df;
      border-radius: 6px;
      padding: 0 12px;
      font: inherit;
      color: #24272f;
      background: #fff;
    }

    button {
      min-height: 42px;
      border: 0;
      border-radius: 6px;
      padding: 0 14px;
      font: inherit;
      font-weight: 800;
      color: #fff;
      background: #2563eb;
      cursor: pointer;
    }

    button.secondary {
      color: #24272f;
      background: #e7ebf2;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    pre {
      overflow: auto;
      min-height: 220px;
      margin: 16px 0 0;
      border-radius: 8px;
      padding: 14px;
      color: #f5f7fb;
      background: #20242c;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <main>
    <h1>Logy Backend Test</h1>

    <div class="grid">
      <section>
        <h2>회원가입</h2>
        <label>
          본명
          <input id="signupRealName" value="홍길동">
        </label>
        <label>
          닉네임
          <input id="signupNickname" value="gildong">
        </label>
        <label>
          비밀번호
          <input id="signupPassword" type="password" value="1234">
        </label>
        <div class="actions">
          <button id="checkNicknameButton" type="button">중복 확인</button>
          <button id="signupButton" type="button">회원가입</button>
        </div>
      </section>

      <section>
        <h2>로그인</h2>
        <label>
          닉네임
          <input id="loginNickname" value="gildong">
        </label>
        <label>
          비밀번호
          <input id="loginPassword" type="password" value="1234">
        </label>
        <div class="actions">
          <button id="loginButton" type="button">로그인</button>
          <button class="secondary" id="clearTokenButton" type="button">토큰 삭제</button>
        </div>
      </section>

      <section>
        <h2>확인</h2>
        <div class="actions">
          <button id="healthButton" type="button">서버 확인</button>
          <button id="meButton" type="button">내 정보</button>
          <button class="secondary" id="logoutButton" type="button">로그아웃 API</button>
        </div>
      </section>
    </div>

    <pre id="output">결과가 여기에 표시됩니다.</pre>
  </main>

  <script>
    const API_BASE_URL = window.location.origin;
    const TOKEN_KEY = "logy_access_token";
    const output = document.getElementById("output");

    function show(value) {
      output.textContent = typeof value === "string" ? value : JSON.stringify(value, null, 2);
    }

    async function request(path, options = {}) {
      const response = await fetch(`${API_BASE_URL}${path}`, {
        ...options,
        headers: {
          "Content-Type": "application/json",
          ...(options.headers || {}),
        },
      });

      const text = await response.text();
      let body = null;

      try {
        body = text ? JSON.parse(text) : null;
      } catch {
        body = text;
      }

      if (!response.ok) {
        throw body;
      }

      return body;
    }

    function authHeaders() {
      const token = localStorage.getItem(TOKEN_KEY);
      return token ? { Authorization: `Bearer ${token}` } : {};
    }

    document.getElementById("healthButton").addEventListener("click", async () => {
      try {
        show(await request("/health"));
      } catch (error) {
        show(error);
      }
    });

    document.getElementById("checkNicknameButton").addEventListener("click", async () => {
      const nickname = document.getElementById("signupNickname").value.trim();

      try {
        show(await request(`/users/check-nickname?nickname=${encodeURIComponent(nickname)}`));
      } catch (error) {
        show(error);
      }
    });

    document.getElementById("signupButton").addEventListener("click", async () => {
      const realName = document.getElementById("signupRealName").value.trim();
      const nickname = document.getElementById("signupNickname").value.trim();
      const password = document.getElementById("signupPassword").value;

      try {
        show(await request("/users/signup", {
          method: "POST",
          body: JSON.stringify({
            real_name: realName,
            nickname,
            password,
          }),
        }));
      } catch (error) {
        show(error);
      }
    });

    document.getElementById("loginButton").addEventListener("click", async () => {
      const nickname = document.getElementById("loginNickname").value.trim();
      const password = document.getElementById("loginPassword").value;

      try {
        const result = await request("/auth/login", {
          method: "POST",
          body: JSON.stringify({ nickname, password }),
        });
        localStorage.setItem(TOKEN_KEY, result.access_token);
        show(result);
      } catch (error) {
        show(error);
      }
    });

    document.getElementById("meButton").addEventListener("click", async () => {
      try {
        show(await request("/users/me", {
          headers: authHeaders(),
        }));
      } catch (error) {
        show(error);
      }
    });

    document.getElementById("logoutButton").addEventListener("click", async () => {
      try {
        show(await request("/auth/logout", {
          method: "POST",
          headers: authHeaders(),
        }));
      } catch (error) {
        show(error);
      }
    });

    document.getElementById("clearTokenButton").addEventListener("click", () => {
      localStorage.removeItem(TOKEN_KEY);
      show("브라우저에 저장된 토큰을 삭제했습니다.");
    });
  </script>
</body>
</html>
